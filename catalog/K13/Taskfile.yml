version: '3'

vars:
  PROJECT_DIR: "{{.TASKFILE_DIR}}"
  SCRIPT_DIR: "{{.PROJECT_DIR}}/scripts"
  LOG_DIR: "{{.PROJECT_DIR}}/logs"

  # Metadata CIS Benchmark
  ID: "K13"
  NAMA: "Status Layanan Journald"
  KODE_CIS: "6.1.1.1"
  CIS_JUDUL: "6.1.1.1 Ensure journald service is enabled and active"
  DESKRIPSI: |
    Aturan keamanan untuk memastikan service systemd-journald 
    selalu aktif dan berjalan secara otomatis saat sistem booting. 
    Fungsinya untuk memastikan pencatatan log sistem berjalan 
    terus-menerus tanpa gangguan demi keperluan audit dan pemantauan.
  RISIKO: "AMAN"
  KATEGORI: "Logging and Auditing"
  AUDIT_ONLY: false

tasks:
  # Task internal untuk memastikan folder logs/ selalu ada
  init-log-dir:
    internal: true
    cmds:
      - mkdir -p {{.LOG_DIR}}

  # 1. Audit Status Service Journald
  audit:
    desc: "Menjalankan audit status service systemd-journald (enabled dan active)"
    deps: [init-log-dir]
    cmds:
      - sudo python3 {{.SCRIPT_DIR}}/audit.py

  # 2. Hardening Service Journald (Mengaktifkan dan menjalankan journald)
  hardening:
    desc: "Mengaktifkan dan menjalankan service systemd-journald secara permanen"
    deps: [init-log-dir]
    cmds:
      - sudo python3 {{.SCRIPT_DIR}}/hardening.py

  # 3. Rollback Service Journald (Mengembalikan ke kondisi awal jika diperlukan)
  rollback:
    desc: "Mengembalikan status service systemd-journald ke kondisi sebelum hardening"
    deps: [init-log-dir]
    cmds:
      - sudo python3 {{.SCRIPT_DIR}}/rollback.py