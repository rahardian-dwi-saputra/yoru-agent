version: '3'

vars:
  PROJECT_DIR: "{{.TASKFILE_DIR}}"
  SCRIPT_DIR: "{{.PROJECT_DIR}}/scripts"
  LOG_DIR: "{{.PROJECT_DIR}}/logs"

  ID: "K10"
  NAMA: "Penyimpanan Log Journald Permanen"
  KODE_CIS: "6.1.2.4"
  JUDUL_CIS: "Ensure journald Storage is configured"
  VERSI_CIS: "Ubuntu 24.04 LTS Benchmark v2.0.0"
  REGULASI: "Pasal 31, Pasal 35"
  KEPATUHAN: "UU PDP No. 27/2022"
  FRAMEWORK: "CIS Benchmark & UU PDP"
  DESKRIPSI: |
    Aturan keamanan untuk memastikan systemd-journald dikonfigurasi
    menggunakan penyimpanan log permanen (Storage=persistent) pada disk.
    Fungsinya untuk menjaga ketersediaan log sistem setelah server 
    mengalami reboot sehingga dapat digunakan untuk audit, 
    pemantauan keamanan,dan investigasi insiden.
  RISIKO: "SEDANG"
  KATEGORI: "Logging and Auditing"
  AUDIT_ONLY: false
  PESAN_HARDENING: |
    Aksi ini akan mengubah parameter 'Storage' menjadi 'persistent'pada 
    konfigurasi systemd-journald dan merestart layanan systemd-journald.
    ⚠️ PERINGATAN: 
    Log sistem akan disimpan secara permanen pada disk.Pastikan 
    kapasitas penyimpanan server mencukupi dan kebijakan retensi 
    log telah dikonfigurasi dengan tepat.
  PESAN_ROLLBACK: |
    Aksi ini akan mengembalikan parameter 'Storage' ke nilai semula 
    sebelum proses hardening dan merestart layanan systemd-journald.
    ⚠️ RISIKO KEAMANAN: 
    Jika nilai sebelumnya adalah 'volatile', log baru akan disimpan 
    sementara di memori dan dapat hilang setelah reboot. Pastikan 
    kebutuhan audit dan investigasi keamanan tetap terpenuhi.

tasks:
  init-log-dir:
    desc: 'Membuat direktori log jika belum tersedia'
    internal: true
    cmds:
      - mkdir -p {{.LOG_DIR}}

  audit:
    desc: "Menjalankan audit pengaturan penyimpanan permanen log systemd-journald"
    deps: [init-log-dir]
    cmds:
      - sudo python3 {{.SCRIPT_DIR}}/audit.py

  hardening:
    desc: "Menerapkan konfigurasi penyimpanan permanen log journald"
    deps: [init-log-dir]
    cmds:
      - sudo python3 {{.SCRIPT_DIR}}/hardening.py

  rollback:
    desc: "Mengembalikan konfigurasi penyimpanan log journald ke kondisi sebelum hardening"
    deps: [init-log-dir]
    cmds:
      - sudo python3 {{.SCRIPT_DIR}}/rollback.py