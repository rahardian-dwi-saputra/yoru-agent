version: '3'

vars:
  PROJECT_DIR: "{{.TASKFILE_DIR}}"
  SCRIPT_DIR: "{{.PROJECT_DIR}}/scripts"
  LOG_DIR: "{{.PROJECT_DIR}}/logs"

  ID: "K04"
  NAMA: "Membatasi Percobaan Auth SSH (MaxAuthTries)"
  KODE_CIS: "5.1.16"
  CIS_JUDUL: "5.1.16 Ensure sshd MaxAuthTries is configured"
  REGULASI: "Pasal 35, Pasal 39"
  KEPATUHAN: "UU PDP No. 27/2022"
  FRAMEWORK: "CIS Benchmark & UU PDP"
  DESKRIPSI: |
    Aturan keamanan untuk membatasi jumlah percobaan autentikasi/login 
    SSH yang gagal dalam satu koneksi. Fungsinya untuk mengurangi 
    risiko serangan brute-force, karena penyerang tidak dapat mencoba 
    password atau kredensial berkali-kali tanpa batas.
  RISIKO: "TINGGI"
  KATEGORI: "SSH Security"
  AUDIT_ONLY: false
  PESAN_HARDENING: |
    Aksi ini akan menetapkan parameter 'MaxAuthTries' menjadi 4
    pada file konfigurasi SSH dan merestart layanan SSH.
    ⚠️ DAMPAK OPERASIONAL: 
    Jumlah kesalahan pengetikan password atau kunci SSH dibatasi 
    maksimal 4 kali dalam satu sesi koneksi. Jika melebihi batas, 
    server akan otomatis memutuskan koneksi. Pastikan Anda teliti 
    saat melakukan login!
  PESAN_ROLLBACK: |
    ini akan mengembalikan atau menghapus pengaturan 
    'MaxAuthTries' ke nilai default sistem.
    ⚠️ RISIKO KEAMANAN: 
    Penyerang memiliki kesempatan lebih banyak untuk mencoba 
    menebak kombinasi kredensial (brute-force) dalam 
    satu sesi koneksi SSH yang sama tanpa batasan ketat.

tasks:
  init-log-dir:
    desc: 'Membuat direktori log jika belum tersedia'
    internal: true
    cmds:
      - mkdir -p {{.LOG_DIR}}
      
  info:
    desc: "Menampilkan perintah pengecekan MaxAuthTries sesuai standar CIS 5.1.16"
    silent: true
    cmds:
    - |
      printf '%s\n' \
        '==================================================' \
        ' Perintah Pengecekan MaxAuthTries:' \
        '   sshd -T | grep -i maxauthtries' \
        '   grep -i "^MaxAuthTries" /etc/ssh/sshd_config*' \
        ' Standar Nilai:' \
        '   MaxAuthTries harus diatur ke 4 atau kurang (misal: MaxAuthTries 4).' \
        '=================================================='

  audit:
    desc: "Menjalankan audit untuk MaxAuthTries"
    deps: [init-log-dir]
    cmds:
      - python3 {{.SCRIPT_DIR}}/audit.py

  hardening:
    desc: "Menjalankan hardening untuk MaxAuthTries"
    deps: [init-log-dir]
    cmds:
      - python3 {{.SCRIPT_DIR}}/hardening.py

  rollback:
    desc: "Menjalankan rollback untuk MaxAuthTries"
    deps: [init-log-dir]
    cmds:
      - python3 {{.SCRIPT_DIR}}/rollback.py