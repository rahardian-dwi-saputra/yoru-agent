version: '3'

vars:
  PROJECT_DIR: "{{.TASKFILE_DIR}}"
  SCRIPT_DIR: "{{.PROJECT_DIR}}/scripts"
  LOG_DIR: "{{.PROJECT_DIR}}/logs"

  # Metadata CIS Benchmark
  ID: "K08"
  NAMA: "Layanan Auditd Aktif dan Enabler"
  KODE_CIS: "4.1.1.2"
  CIS_JUDUL: "4.1.1.2 Ensure auditd service is enabled and active"
  DESKRIPSI: |
    Aturan keamanan untuk memastikan layanan auditd selalu aktif 
    dan berjalan untuk mencatat aktivitas penting yang terjadi 
    pada sistem. Fungsinya untuk menyediakan rekaman aktivitas 
    sistem yang dapat digunakan untuk pemantauan, pemeriksaan, 
    dan investigasi ketika terjadi masalah atau insiden keamanan.
  RISIKO: "HIGH"
  KATEGORI: "LOGGING"
  AUDIT_ONLY: true

tasks:
  # Task internal untuk memastikan folder logs/ selalu ada
  init-log-dir:
    internal: true
    cmds:
      - mkdir -p {{.LOG_DIR}}

  # Audit Task (Satu-satunya task eksekusi karena AUDIT_ONLY: true)
  audit:
    desc: "Menjalankan audit ketersediaan dan status layanan auditd"
    deps: [init-log-dir]
    cmds:
      - sudo python3 {{.SCRIPT_DIR}}/audit.py