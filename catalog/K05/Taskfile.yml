version: '3'

vars:
  PROJECT_DIR: "{{.TASKFILE_DIR}}"
  SCRIPT_DIR: "{{.PROJECT_DIR}}/scripts"
  LOG_DIR: "{{.PROJECT_DIR}}/logs"

  ID: "K05"
  NAMA: "Pengaturan Ciphers SSH yang Aman (Enkripsi Transport)"
  KODE_CIS: "5.1.6"
  JUDUL_CIS: "Ensure sshd Ciphers are configured"
  VERSI_CIS: "Ubuntu 24.04 LTS Benchmark v2.0.0"
  REGULASI: "Pasal 35, Pasal 39"
  KEPATUHAN: "UU PDP No. 27/2022"
  FRAMEWORK: "CIS Benchmark & UU PDP"
  DESKRIPSI: |
    Aturan keamanan untuk memastikan SSH hanya menggunakan 
    algoritma enkripsi (cipher) yang aman dan sesuai standar 
    saat melakukan komunikasi. Fungsinya untuk melindungi data 
    yang dikirim antara client dan server SSH agar tidak mudah 
    dibaca atau disadap oleh pihak yang tidak berwenang.
  RISIKO: "TINGGI"
  KATEGORI: "SSH Security"
  AUDIT_ONLY: false
  PESAN_HARDENING: |
    Aksi ini akan menetapkan parameter 'Ciphers' hanya pada algoritma 
    enkripsi yang kuat dan disetujui standar CIS (seperti AES-GCM dan 
    ChaCha20-Poly1305) pada konfigurasi SSH serta merestart layanan SSH.
    ⚠️ DAMPAK OPERASIONAL: 
    Perangkat atau klien SSH lama (*legacy clients*) yang hanya 
    mendukung cipher usang tidak akan bisa terhubung ke server ini. 
    Pastikan perangkat admin Anda mendukung standar enkripsi modern!
  PESAN_ROLLBACK: |
    Aksi ini akan menonaktifkan pengaturan 'Ciphers' pada 
    konfigurasi SSH sesuai konfigurasi default sistem operasi.
    ⚠️ RISIKO KEAMANAN: 
    Server akan kembali mengizinkan penggunaan algoritma enkripsi 
    lama/lemah, meningkatkan risiko kerentanan dekripsi data di 
    jalur komunikasi (*transport layer*).

tasks:
  init-log-dir:
    desc: 'Membuat direktori log jika belum tersedia'
    internal: true
    cmds:
      - mkdir -p {{.LOG_DIR}}

  audit:
    desc: "Menjalankan audit konfigurasi SSH Ciphers"
    deps: [init-log-dir]
    cmds:
      - sudo python3 {{.SCRIPT_DIR}}/audit.py

  hardening:
    desc: "Menerapkan konfigurasi Ciphers terenkripsi kuat pada SSH"
    deps: [init-log-dir]
    cmds:
      - sudo python3 {{.SCRIPT_DIR}}/hardening.py

  rollback:
    desc: "Mengembalikan konfigurasi Ciphers SSH ke nilai default/kondisi sebelum hardening"
    deps: [init-log-dir]
    cmds:
      - sudo python3 {{.SCRIPT_DIR}}/rollback.py