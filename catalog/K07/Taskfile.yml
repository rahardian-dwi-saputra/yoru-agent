version: '3'

vars:
  PROJECT_DIR: "{{.TASKFILE_DIR}}"
  SCRIPT_DIR: "{{.PROJECT_DIR}}/scripts"
  LOG_DIR: "{{.PROJECT_DIR}}/logs"

  ID: "K07"
  NAMA: "Pengaturan KexAlgorithms SSH yang Aman"
  KODE_CIS: "5.1.12"
  JUDUL_CIS: "Ensure sshd KexAlgorithms are configured"
  VERSI_CIS: "Ubuntu 24.04 LTS Benchmark v2.0.0"
  REGULASI: "Pasal 35, Pasal 39"
  KEPATUHAN: "UU PDP No. 27/2022"
  FRAMEWORK: "CIS Benchmark & UU PDP"
  DESKRIPSI: |
    Aturan keamanan untuk memastikan SSH hanya menggunakan 
    algoritma pertukaran kunci (Key Exchange/KEX) yang aman 
    saat membuat koneksi. Fungsinya untuk melindungi proses 
    pembentukan kunci enkripsi antara client dan server agar 
    tidak mudah dieksploitasi oleh pihak yang tidak berwenang.
  RISIKO: "TINGGI"
  KATEGORI: "SSH Security"
  AUDIT_ONLY: false
  PESAN_HARDENING: |
    Aksi ini akan menetapkan parameter 'KexAlgorithms' hanya pada 
    algoritma pertukaran kunci modern yang disetujui standar CIS 
    (seperti curve25519-sha256, diffie-hellman-group16-sha512) 
    pada konfigurasi SSH serta merestart layanan SSH.
    ⚠️ DAMPAK OPERASIONAL: 
    Klien SSH atau skrip otomatisasi lama yang masih menggunakan 
    algoritma Kex usang tidak akan dapat terhubung ke server. 
    Pastikan perangkat penghubung Anda mendukung standar 
    kriptografi modern!
  PESAN_ROLLBACK: |
    Aksi ini akan menonaktifkan pengaturan 'KexAlgorithms' 
    pada konfigurasi SSH sesuai konfigurasi default sistem operasi.
    ⚠️ RISIKO KEAMANAN: 
    Server akan kembali mengizinkan algoritma pertukaran kunci 
    lama yang berpotensi memiliki kelemahan matematis atau 
    rentan terhadap analisis dekripsi jangka panjang.

tasks:
  init-log-dir:
    desc: 'Membuat direktori log jika belum tersedia'
    internal: true
    cmds:
      - mkdir -p {{.LOG_DIR}}

  audit:
    desc: "Menjalankan audit konfigurasi SSH KexAlgorithms"
    deps: [init-log-dir]
    cmds:
      - sudo python3 {{.SCRIPT_DIR}}/audit.py

  hardening:
    desc: "Menerapkan konfigurasi KexAlgorithms terenkripsi kuat pada SSH"
    deps: [init-log-dir]
    cmds:
      - sudo python3 {{.SCRIPT_DIR}}/hardening.py

  rollback:
    desc: "Mengembalikan konfigurasi KexAlgorithms SSH ke nilai default/kondisi sebelum hardening"
    deps: [init-log-dir]
    cmds:
      - sudo python3 {{.SCRIPT_DIR}}/rollback.py