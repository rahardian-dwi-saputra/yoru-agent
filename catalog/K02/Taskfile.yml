version: '3'

vars:
  PROJECT_DIR: "{{.TASKFILE_DIR}}"
  SCRIPT_DIR: "{{.PROJECT_DIR}}/scripts"
  LOG_DIR: "{{.PROJECT_DIR}}/logs"

  ID: "K02"
  NAMA: "Login SSH menggunakan Password Dimatikan (Khusus SSH Key)"
  KODE_CIS: "5.2.14"
  CIS_JUDUL: "5.2.14 Ensure SSH PasswordAuthentication is disabled"
  REGULASI: "Pasal 35, Pasal 36"
  KEPATUHAN: "UU PDP No. 27/2022"
  FRAMEWORK: "CIS Benchmark & UU PDP"
  DESKRIPSI: |
    Aturan keamanan untuk memastikan login ke server melalui SSH tidak 
    menggunakan password, melainkan metode autentikasi kriptografi yang lebih aman 
    seperti SSH Public Key. Fungsinya untuk mencegah serangan brute-force, 
    credential stuffing, dan pencurian password sesuai standar perlindungan data.
  RISIKO: "TINGGI"
  KATEGORI: "SSH"
  AUDIT_ONLY: false
  PESAN_HARDENING: |
    Aksi ini akan mengubah parameter 'PasswordAuthentication' menjadi 'no' 
    pada file /etc/ssh/sshd_config dan merestart layanan SSH.
    ⚠️ DAMPAK KRITIS: Anda dan administrator lain TIDAK AKAN BISA 
    login menggunakan password lagi. Pastikan SSH Public Key Anda 
    (id_rsa.pub / id_ed25519.pub) sudah terpasang di dalam server 
    (~/.ssh/authorized_keys) sebelum melanjutkan!
  PESAN_ROLLBACK: |
    Aksi ini akan mengembalikan parameter 'PasswordAuthentication' 
    ke nilai semula ('yes' / default) pada file /etc/ssh/sshd_config 
    dan merestart layanan SSH.
    ⚠️ RISIKO KEAMANAN: Login menggunakan password diizinkan kembali, 
    membuat server rentan terhadap serangan brute-force password.

tasks:
  init-log-dir:
    internal: true
    cmds:
      - mkdir -p {{.LOG_DIR}}

  check-ssh-keys:
    desc: "Mengecek apakah user non-root sudah memiliki SSH public key di authorized_keys"
    cmds:
    - |
      echo "=== User dengan authorized_keys (Bisa Login SSH Key) ==="
      found=0

      for user_home in /home/*; do
        [ -d "$user_home" ] || continue

        user="$(basename "$user_home")"
        key_file="$user_home/.ssh/authorized_keys"

        if [ -f "$key_file" ]; then
          echo "OK: $user memiliki $key_file"
          found=1
        fi
      done

      if [ "$found" -eq 0 ]; then
        echo "WARNING: Tidak ditemukan authorized_keys pada user non-root!"
      fi

  audit:
    desc: "Menjalankan audit parameter PasswordAuthentication di sshd_config"
    deps: [init-log-dir]
    cmds:
      - sudo python3 {{.SCRIPT_DIR}}/audit.py

  hardening:
    desc: "Menonaktifkan login password via SSH (PasswordAuthentication no)"
    deps: [init-log-dir]
    cmds:
      - sudo python3 {{.SCRIPT_DIR}}/hardening.py

  rollback:
    desc: "Mengembalikan parameter PasswordAuthentication via SSH ke nilai 'yes'"
    deps: [init-log-dir]
    cmds:
      - sudo python3 {{.SCRIPT_DIR}}/rollback.py