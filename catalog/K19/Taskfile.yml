version: '3'

vars:
  PROJECT_DIR: "{{.TASKFILE_DIR}}"
  SCRIPT_DIR: "{{.PROJECT_DIR}}/scripts"
  LOG_DIR: "{{.PROJECT_DIR}}/logs"

  # Metadata CIS Benchmark
  ID: "K19"
  NAMA: "Pengaktifan TCP SYN Cookies"
  KODE_CIS: "3.3.10"
  CIS_JUDUL: "3.3.10 Ensure tcp syn cookies is enabled"
  DESKRIPSI: |
    Aturan keamanan untuk mengonfigurasi parameter kernel agar mengaktifkan 
    TCP SYN cookies (`net.ipv4.tcp_syncookies = 1`). 
    Fungsinya untuk melindungi server dari serangan Denial of Service (DoS) 
    jenis SYN flood dengan menggunakan teknik enkripsi state-less cookies 
    pada handshake TCP.
  RISIKO: "AMAN"
  KATEGORI: "Network Configuration"
  AUDIT_ONLY: false

tasks:
  # Task internal untuk memastikan folder logs/ selalu ada
  init-log-dir:
    internal: true
    cmds:
      - mkdir -p {{.LOG_DIR}}

  # 1. Audit Konfigurasi TCP SYN Cookies
  audit:
    desc: "Menjalankan audit parameter kernel untuk TCP SYN cookies"
    deps: [init-log-dir]
    cmds:
      - sudo python3 {{.SCRIPT_DIR}}/audit.py

  # 2. Hardening Konfigurasi TCP SYN Cookies (Mengaktifkan tcp_syncookies = 1)
  hardening:
    desc: "Menerapkan konfigurasi TCP SYN cookies secara permanen via sysctl"
    deps: [init-log-dir]
    cmds:
      - sudo python3 {{.SCRIPT_DIR}}/hardening.py

  # 3. Rollback Konfigurasi TCP SYN Cookies (Mengembalikan ke kondisi awal)
  rollback:
    desc: "Mengembalikan konfigurasi kernel TCP SYN cookies ke kondisi sebelum hardening"
    deps: [init-log-dir]
    cmds:
      - sudo python3 {{.SCRIPT_DIR}}/rollback.py