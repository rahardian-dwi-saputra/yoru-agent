version: '3'

vars:
  PROJECT_DIR: "{{.TASKFILE_DIR}}"
  SCRIPT_DIR: "{{.PROJECT_DIR}}/scripts"
  LOG_DIR: "{{.PROJECT_DIR}}/logs"

  # Metadata CIS Benchmark
  ID: "K15"
  NAMA: "Kompresi Log Journald"
  KODE_CIS: "6.1.2.3"
  CIS_JUDUL: "6.1.2.3 Ensure journald Compress is configured"
  DESKRIPSI: |
    Aturan keamanan untuk memastikan systemd-journald dikonfigurasi 
    agar mengompresi log sistem saat ukurannya melebihi batas tertentu. 
    Fungsinya untuk menghemat ruang penyimpanan disk dan menjaga efisiensi 
    pencatatan log dalam jangka panjang tanpa mengganggu layanan.
  RISIKO: "AMAN"
  KATEGORI: "Logging and Auditing"
  AUDIT_ONLY: false

tasks:
  # Task internal untuk memastikan folder logs/ selalu ada
  init-log-dir:
    internal: true
    cmds:
      - mkdir -p {{.LOG_DIR}}

  # 1. Audit Konfigurasi Kompresi Journald
  audit:
    desc: "Menjalankan audit pengaturan kompresi log systemd-journald"
    deps: [init-log-dir]
    cmds:
      - sudo python3 {{.SCRIPT_DIR}}/audit.py

  # 2. Hardening Konfigurasi Kompresi Journald (Mengatur Compress=yes)
  hardening:
    desc: "Menerapkan konfigurasi kompresi log journald secara permanen"
    deps: [init-log-dir]
    cmds:
      - sudo python3 {{.SCRIPT_DIR}}/hardening.py

  # 3. Rollback Konfigurasi Kompresi Journald (Mengembalikan ke kondisi awal)
  rollback:
    desc: "Mengembalikan konfigurasi kompresi log journald ke kondisi sebelum hardening"
    deps: [init-log-dir]
    cmds:
      - sudo python3 {{.SCRIPT_DIR}}/rollback.py