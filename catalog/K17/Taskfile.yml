version: '3'

vars:
  PROJECT_DIR: "{{.TASKFILE_DIR}}"
  SCRIPT_DIR: "{{.PROJECT_DIR}}/scripts"
  LOG_DIR: "{{.PROJECT_DIR}}/logs"

  ID: "K17"
  NAMA: "Penolakan ICMP Redirect"
  KODE_CIS: "3.3.5"
  JUDUL_CIS: "Ensure icmp redirects are not accepted"
  VERSI_CIS: "Ubuntu 24.04 LTS Benchmark v2.0.0"
  REGULASI: "Pasal 35, Pasal 39"
  KEPATUHAN: "UU PDP No. 27/2022"
  FRAMEWORK: "CIS Benchmark & UU PDP"
  DESKRIPSI: |
    Aturan keamanan untuk mengonfigurasi parameter kernel agar menolak 
    paket ICMP redirect. Fungsinya untuk mencegah pihak luar atau entitas 
    tidak berotoritas memanipulasi tabel routing lokal server (mitm attack).
  RISIKO: "RENDAH"
  KATEGORI: "Network Security"
  AUDIT_ONLY: 
  PESAN_HARDENING: |
    Aksi ini akan mengubah parameter kernel untuk menolak paket 
    ICMP redirect ('net.ipv4.conf.all.accept_redirects' dan 
    'net.ipv4.conf.default.accept_redirects') menjadi '0' melalui 
    file konfigurasi sysctl, kemudian menerapkannya ke sistem.
    ⚠️ PERINGATAN: 
    Server akan mengabaikan paket ICMP redirect yang masuk untuk 
    mencegah potensi manipulasi tabel routing lokal 
    (Man-in-the-Middle Attack).
  PESAN_ROLLBACK: |
    Aksi ini akan mengembalikan parameter kernel penolakan ICMP 
    redirect ke nilai semula pada konfigurasi sysctl dan menerapkannya 
    kembali ke sistem.
    ⚠️ RISIKO KEAMANAN: 
    Server Anda dapat kembali menerima paket ICMP redirect. Hal ini 
    berisiko membuka celah bagi pihak luar untuk memanipulasi 
    informasi routing jaringan server.

tasks:
  init-log-dir:
    desc: 'Membuat direktori log jika belum tersedia'
    internal: true
    cmds:
      - mkdir -p {{.LOG_DIR}}

  audit:
    desc: "Menjalankan audit parameter kernel untuk penolakan ICMP redirect"
    deps: [init-log-dir]
    cmds:
      - sudo python3 {{.SCRIPT_DIR}}/audit.py

  hardening:
    desc: "Menerapkan konfigurasi penolakan ICMP redirect secara permanen via sysctl"
    deps: [init-log-dir]
    cmds:
      - sudo python3 {{.SCRIPT_DIR}}/hardening.py

  rollback:
    desc: "Mengembalikan konfigurasi kernel ICMP redirect ke kondisi sebelum hardening"
    deps: [init-log-dir]
    cmds:
      - sudo python3 {{.SCRIPT_DIR}}/rollback.py