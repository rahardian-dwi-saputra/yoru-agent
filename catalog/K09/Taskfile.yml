version: '3'

vars:
  PROJECT_DIR: "{{.TASKFILE_DIR}}"
  SCRIPT_DIR: "{{.PROJECT_DIR}}/scripts"
  LOG_DIR: "{{.PROJECT_DIR}}/logs"

  ID: "K09"
  NAMA: "Pengaturan Akses File Log Journald"
  KODE_CIS: "6.1.1.2"
  JUDUL_CIS: "Ensure journald log file access is configured"
  VERSI_CIS: "Ubuntu 24.04 LTS Benchmark v2.0.0"
  REGULASI: "Pasal 35, Pasal 36"
  KEPATUHAN: "UU PDP No. 27/2022"
  FRAMEWORK: "CIS Benchmark & UU PDP"
  DESKRIPSI: |
    Aturan keamanan untuk memastikan direktori dan berkas log 
    systemd-journald memiliki izin akses yang aman (permissions dan 
    kepemilikan yang tepat) sehingga tidak dapat dibaca atau 
    dimanipulasi secara sembarangan oleh user yang tidak berotoritas.
  RISIKO: "TINGGI"
  KATEGORI: "Logging and Auditing"
  AUDIT_ONLY: false
  PESAN_HARDENING: |
    Aksi ini akan memperketat permission direktori dan file log
    systemd-journald sesuai konfigurasi keamanan CIS Benchmark.
    Direktori log akan dihilangkan dari permission world-writable,
    sedangkan file dan subdirektori akan dihilangkan dari permission
    group-writable dan world-writable.
    ⚠️ PERINGATAN: 
    Pembatasan permission dapat menyebabkan user atau proses 
    aplikasi yang tidak memiliki hak akses memadai kehilangan 
    kemampuan untuk membaca atau mengakses file log journald 
    secara langsung. Ownership file dan direktori tidak diubah.
  PESAN_ROLLBACK: |
    Aksi ini akan mengembalikan permission dan ownership direktori
    serta file log systemd-journald berdasarkan metadata backup
    yang dibuat sebelum proses hardening.
    ⚠️ RISIKO KEAMANAN:
    Permission dan ownership dapat kembali ke kondisi sebelumnya,
    termasuk konfigurasi yang memungkinkan user atau proses yang
    tidak berwenang mengakses file log sistem.

tasks:
  init-log-dir:
    desc: 'Membuat direktori log jika belum tersedia'
    internal: true
    cmds:
      - mkdir -p {{.LOG_DIR}}
      - chmod 700 {{.LOG_DIR}}

  audit:
    desc: "Menjalankan audit izin akses dan kepemilikan file log journald"
    deps: [init-log-dir]
    cmds:
      - sudo python3 {{.SCRIPT_DIR}}/audit.py

  hardening:
    desc: "Menerapkan konfigurasi izin akses dan kepemilikan yang aman pada direktori log journald"
    deps: [init-log-dir]
    cmds:
      - sudo python3 {{.SCRIPT_DIR}}/hardening.py

  rollback:
    desc: "Mengembalikan izin akses file log journald ke kondisi sebelum hardening"
    deps: [init-log-dir]
    cmds:
      - sudo python3 {{.SCRIPT_DIR}}/rollback.py