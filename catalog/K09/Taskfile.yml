version: '3'

vars:
  PROJECT_DIR: "{{.TASKFILE_DIR}}"
  SCRIPT_DIR: "{{.PROJECT_DIR}}/scripts"
  LOG_DIR: "{{.PROJECT_DIR}}/logs"

  ID: "K09"
  NAMA: "Pengaturan Akses File Log Journald"
  KODE_CIS: "6.1.1.2"
  CIS_JUDUL: "6.1.1.2 Ensure journald log file access is configured"
  REGULASI: "Pasal 35, Pasal 36"
  KEPATUHAN: "UU PDP No. 27/2022"
  FRAMEWORK: "CIS Benchmark & UU PDP"
  DESKRIPSI: |
    Aturan keamanan untuk memastikan direktori dan berkas log systemd-journald 
    memiliki izin akses yang aman (permissions dan kepemilikan yang tepat) 
    sehingga tidak dapat dibaca atau dimanipulasi secara sembarangan oleh user 
    yang tidak berotoritas.
  RISIKO: "RENDAH"
  KATEGORI: "Logging and Auditing"
  AUDIT_ONLY: false
  PESAN_HARDENING: |
    Aksi ini akan memperketat izin akses file dan direktori log Journald 
    sistem dan memastikan kepemilikan (ownership) yang aman sesuai CIS 
    Benchmark. ⚠️ DAMPAK: User biasa atau proses aplikasi yang tidak 
    memiliki hak akses yang tepat tidak akan dapat membaca direktori 
    log systemd-journald secara langsung.
  PESAN_ROLLBACK: |
    Aksi ini akan mengembalikan hak akses (permissions dan ownership) 
    direktori log Journald ke kondisi semula.
    ⚠️ RISIKO: Berkas log sistem dapat kembali dibaca oleh user 
    yang tidak berotoritas, menurunkan tingkat kerahasiaan data log.

tasks:
  init-log-dir:
    internal: true
    cmds:
      - mkdir -p {{.LOG_DIR}}

  audit:
    desc: "Menjalankan audit izin akses dan kepemilikan file log journald"
    deps: [init-log-dir]
    cmds:
      - sudo python3 {{.SCRIPT_DIR}}/audit.py

  hardening:
    desc: "Menerapkan konfigurasi izin akses dan kepemilikan yang aman pada direktori log journald"
    deps: [init-log-dir]
    cmds:
      - sudo python3 {{.SCRIPT_DIR}}/hardening.py

  rollback:
    desc: "Mengembalikan izin akses file log journald ke kondisi sebelum hardening"
    deps: [init-log-dir]
    cmds:
      - sudo python3 {{.SCRIPT_DIR}}/rollback.py