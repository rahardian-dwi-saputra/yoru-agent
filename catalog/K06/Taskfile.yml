version: '3'

vars:
  PROJECT_DIR: "{{.TASKFILE_DIR}}"
  SCRIPT_DIR: "{{.PROJECT_DIR}}/scripts"
  LOG_DIR: "{{.PROJECT_DIR}}/logs"

  ID: "K06"
  NAMA: "Pengaturan MACs SSH yang Aman (Integritas Pesan)"
  KODE_CIS: "5.1.15"
  CIS_JUDUL: "5.1.15 Ensure sshd MACs are configured"
  REGULASI: "Pasal 35, Pasal 39"
  KEPATUHAN: "UU PDP No. 27/2022"
  FRAMEWORK: "CIS Benchmark & UU PDP"
  DESKRIPSI: |
    Aturan keamanan untuk memastikan SSH hanya menggunakan 
    algoritma MAC (Message Authentication Code) yang aman 
    untuk memeriksa keaslian dan integritas data. Fungsinya 
    untuk mencegah data komunikasi SSH diubah atau dimanipulasi 
    oleh pihak yang tidak berwenang selama proses komunikasi.
  RISIKO: "TINGGI"
  KATEGORI: "SSH Security"
  AUDIT_ONLY: false
  PESAN_HARDENING: |
    Aksi ini akan menetapkan parameter 'MACs' hanya pada algoritma 
    integritas pesan yang kuat dan disetujui standar CIS 
    (seperti hmac-sha2-256, hmac-sha2-512, atau yang berbasis 
    Galois/Counter Mode) pada file /etc/ssh/sshd_config serta 
    merestart layanan SSH.
    ⚠️ DAMPAK OPERASIONAL: Klien atau sistem pemantauan lama yang 
    menggunakan algoritma MAC usang (seperti hmac-md5 atau hmac-sha1) 
    tidak akan dapat terhubung ke server. Pastikan klien SSH Anda 
    mendukung algoritma modern!
  PESAN_ROLLBACK: |
    Aksi ini akan mengembalikan atau menghapus pengaturan 'MACs' 
    khusus ke konfigurasi default sistem operasi.
    ⚠️ RISIKO KEAMANAN: Server akan kembali mengizinkan algoritma 
    MAC yang lemah, meningkatkan potensi kerentanan manipulasi 
    paket data di jalur komunikasi (*packet tampering*).

tasks:
  init-log-dir:
    internal: true
    cmds:
      - mkdir -p {{.LOG_DIR}}

  audit:
    desc: "Menjalankan audit konfigurasi SSH MACs"
    deps: [init-log-dir]
    cmds:
      - sudo python3 {{.SCRIPT_DIR}}/audit.py

  hardening:
    desc: "Menerapkan konfigurasi MACs terenkripsi kuat pada SSH"
    deps: [init-log-dir]
    cmds:
      - sudo python3 {{.SCRIPT_DIR}}/hardening.py

  rollback:
    desc: "Mengembalikan konfigurasi MACs SSH ke nilai default/kondisi sebelum hardening"
    deps: [init-log-dir]
    cmds:
      - sudo python3 {{.SCRIPT_DIR}}/rollback.py