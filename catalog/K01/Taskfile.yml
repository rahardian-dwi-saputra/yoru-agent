version: '3'

vars:
  PROJECT_DIR: "{{.TASKFILE_DIR}}"
  SCRIPT_DIR: "{{.PROJECT_DIR}}/scripts"
  LOG_DIR: "{{.PROJECT_DIR}}/logs"

  ID: "K01"
  NAMA: "Root Tidak Bisa Login Lewat SSH"
  KODE_CIS: "5.1.20"
  CIS_JUDUL: "5.1.20 Ensure sshd PermitRootLogin is disabled"
  REGULASI: "Pasal 35, Pasal 36, Pasal 39"
  KEPATUHAN: "UU PDP No. 27/2022"
  FRAMEWORK: "CIS Benchmark & UU PDP"
  DESKRIPSI: |
    Mematikan akses login langsung sebagai akun 'root' melalui SSH. 
    Mewajibkan pengguna untuk login menggunakan akun biasa terlebih dahulu 
    sebelum melakukan elevasi hak akses (sudo).
  RISIKO: "TINGGI"
  KATEGORI: "SSH Security"
  AUDIT_ONLY: false
  PESAN_HARDENING: |
    Aksi ini akan mengubah parameter 'PermitRootLogin' menjadi 'no' 
    pada  konfigurasi SSH dan merestart layanan SSH.
    ⚠️ PERINGATAN: 
    Anda TIDAK BISA lagi login SSH secara langsung menggunakan 
    user 'root'. Pastikan Anda sudah memiliki akun user biasa 
    dengan hak akses sudo yang aktif dan telah menguji bahwa 
    akun tersebut dapat digunakan untuk login SSH sebelum melanjutkan.
  PESAN_ROLLBACK: |
    Aksi ini akan mengembalikan parameter 'PermitRootLogin' ke nilai 
    semula ('yes' / default) pada pada  konfigurasi SSH dan merestart layanan SSH.
    ⚠️ RISIKO KEAMANAN: 
    Login root langsung via SSH akan diizinkan kembali. 
    Server Anda berisiko lebih tinggi terhadap serangan brute-force.

tasks:
  init-log-dir:
    desc: 'Membuat direktori log jika belum tersedia'
    internal: true
    cmds:
      - mkdir -p {{.LOG_DIR}}

  check-users:
    desc: "Mengecek daftar user non-root yang memiliki akses SSH atau sudo"
    cmds:
      - echo "=== User dengan Shell Aktif (Bisa Login) ==="
      - awk -F':' '$7 !~ /(nologin|false)/ {print $1}' /etc/passwd
      - echo "=== User di Group Sudo / Wheel ==="
      - getent group sudo wheel 2>/dev/null || true

  audit:
    desc: "Menjalankan audit SSH Root login"
    deps: [init-log-dir]
    cmds:
      - sudo python3 {{.SCRIPT_DIR}}/audit.py

  hardening:
    desc: "Menonaktifkan login Root via SSH"
    deps: [init-log-dir]
    cmds:
      - sudo python3 {{.SCRIPT_DIR}}/hardening.py

  rollback:
    desc: "Mengembalikan parameter PermitRootLogin via SSH ke nilai 'yes'"
    deps: [init-log-dir]
    cmds:
      - sudo python3 {{.SCRIPT_DIR}}/rollback.py