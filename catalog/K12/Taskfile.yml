version: '3'

vars:
  PROJECT_DIR: "{{.TASKFILE_DIR}}"
  SCRIPT_DIR: "{{.PROJECT_DIR}}/scripts"
  LOG_DIR: "{{.PROJECT_DIR}}/logs"

  ID: "K12"
  NAMA: "Memastikan Pembaruan, Patch, dan Perangkat Lunak Keamanan Terpasang"
  KODE_CIS: "1.2.2.1"
  JUDUL_CIS: "Ensure updates, patches, and additional security software are installed"
  VERSI_CIS: "Ubuntu 24.04 LTS Benchmark v2.0.0"
  REGULASI: "Pasal 35, Pasal 39"
  KEPATUHAN: "UU PDP No. 27/2022"
  FRAMEWORK: "CIS Benchmark & UU PDP"
  DESKRIPSI: |
    Aturan keamanan yang mewajibkan sistem memasang pembaruan, 
    patch keamanan, dan perangkat lunak keamanan tambahan sesuai 
    kebutuhan. Fungsinya adalah memperbaiki kerentanan yang diketahui, 
    mengurangi risiko eksploitasi oleh penyerang, dan menjaga sistem 
    tetap aman serta mutakhir.
  RISIKO: "TINGGI"
  KATEGORI: "System Security / Patch Management"
  AUDIT_ONLY: true
  PESAN_HARDENING: "-"
  PESAN_ROLLBACK: "-"

tasks:
  init-log-dir:
    desc: 'Membuat direktori log jika belum tersedia'
    internal: true
    cmds:
      - mkdir -p {{.LOG_DIR}}

  audit:
    desc: "Menjalankan audit pembaruan keamanan dan patch sistem"
    deps: [init-log-dir]
    cmds:
      - sudo python3 {{.SCRIPT_DIR}}/audit.py