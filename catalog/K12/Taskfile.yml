version: '3'

vars:
  PROJECT_DIR: "{{.TASKFILE_DIR}}"
  SCRIPT_DIR: "{{.PROJECT_DIR}}/scripts"
  LOG_DIR: "{{.PROJECT_DIR}}/logs"

  # Metadata CIS Benchmark
  ID: "K12"
  NAMA: "Pengaturan Penyimpanan Log Journald"
  KODE_CIS: "6.1.2.4"
  CIS_JUDUL: "6.1.2.4 Ensure journald Storage is configured"
  DESKRIPSI: |
    Aturan keamanan untuk memastikan systemd-journald dikonfigurasi 
    agar menyimpan log sistem dengan cara yang sesuai. Fungsinya 
    untuk menjaga catatan aktivitas dan kejadian pada sistem 
    agar dapat digunakan untuk pemantauan, pemeriksaan, dan 
    investigasi ketika terjadi masalah atau insiden keamanan.
  RISIKO: "BERISIKO"
  KATEGORI: "Logging and Auditing"
  AUDIT_ONLY: false

tasks:
  # Task internal untuk memastikan folder logs/ selalu ada
  init-log-dir:
    internal: true
    cmds:
      - mkdir -p {{.LOG_DIR}}

  # 1. Audit journald Storage Configuration
  audit:
    desc: "Menjalankan audit konfigurasi penyimpanan journald"
    deps: [init-log-dir]
    cmds:
      - sudo python3 {{.SCRIPT_DIR}}/audit.py

  # 2. Hardening journald Storage (Konfigurasi Storage=persistent)
  hardening:
    desc: "Menerapkan konfigurasi penyimpan log journald secara permanen"
    deps: [init-log-dir]
    cmds:
      - sudo python3 {{.SCRIPT_DIR}}/hardening.py

  # 3. Rollback journald Storage (Mengembalikan konfigurasi ke kondisi awal)
  rollback:
    desc: "Mengembalikan konfigurasi penyimpanan journald ke kondisi sebelum hardening"
    deps: [init-log-dir]
    cmds:
      - sudo python3 {{.SCRIPT_DIR}}/rollback.py