version: '3'

vars:
  PROJECT_DIR: "{{.TASKFILE_DIR}}"
  SCRIPT_DIR: "{{.PROJECT_DIR}}/scripts"
  LOG_DIR: "{{.PROJECT_DIR}}/logs"

  ID: "K11"
  NAMA: "Memastikan Aturan Firewall Aktif dan Memblokir Akses Tidak Perlu"
  KODE_CIS: "3.5.1"
  CIS_JUDUL: "3.5.1 Ensure firewall rules exist"
  REGULASI: "Pasal 35, Pasal 36"
  KEPATUHAN: "UU PDP No. 27/2022"
  FRAMEWORK: "CIS Benchmark & UU PDP"
  DESKRIPSI: |
    Kontrol keamanan yang memastikan firewall memiliki aturan (rules) 
    yang ditetapkan untuk mengatur lalu lintas jaringan yang masuk 
    dan keluar berdasarkan kebutuhan keamanan. Fungsinya adalah 
    mengizinkan koneksi yang sah dan memblokir koneksi yang tidak 
    diizinkan, sehingga mengurangi risiko akses tidak sah dan 
    serangan terhadap sistem.
  RISIKO: "TINGGI"
  KATEGORI: "Firewall"
  AUDIT_ONLY: true
  PESAN_HARDENING: "-"
  PESAN_ROLLBACK: "-"

tasks:
  init-log-dir:
    internal: true
    cmds:
      - mkdir -p {{.LOG_DIR}}

  audit:
    desc: "Menjalankan audit status layanan ufw"
    deps: [init-log-dir]
    cmds:
      - sudo python3 {{.SCRIPT_DIR}}/audit.py