version: '3'

vars:
  PROJECT_DIR: "{{.TASKFILE_DIR}}"
  SCRIPT_DIR: "{{.PROJECT_DIR}}/scripts"
  LOG_DIR: "{{.PROJECT_DIR}}/logs"

  ID: "K03"
  NAMA: "Membatasi Waktu Login SSH (LoginGraceTime)"
  KODE_CIS: "5.1.13"
  CIS_JUDUL: "5.1.13 Ensure sshd LoginGraceTime is configured"
  REGULASI: "Pasal 35, Pasal 39"
  KEPATUHAN: "UU PDP No. 27/2022"
  FRAMEWORK: "CIS Benchmark & UU PDP"
  DESKRIPSI: |
    Aturan keamanan untuk mengatur batas waktu yang diberikan 
    kepada pengguna untuk menyelesaikan proses login SSH. 
    Fungsinya untuk mencegah koneksi SSH yang tidak segera melakukan 
    autentikasi tetap terbuka terlalu lama, sehingga mengurangi 
    risiko penyalahgunaan koneksi dan serangan terhadap server.
  RISIKO: "SEDANG"
  KATEGORI: "SSH Security"
  AUDIT_ONLY: false
  PESAN_HARDENING: |
    Aksi ini akan menetapkan parameter 'LoginGraceTime' 
    (menjadi 1m atau 60 detik) pada konfigurasi SSH dan 
    merestart layanan SSH.
    ⚠️ DAMPAK OPERASIONAL: 
    Pengguna harus menyelesaikan proses login SSH dalam batas 
    waktu yang ditentukan. Jika terlalu lama memasukkan password/kunci, 
    koneksi akan otomatis diputus oleh server.
  PESAN_ROLLBACK: |
    Aksi ini akan mengembalikan pengaturan 'LoginGraceTime' 
    ke kondisi default sistem.
    ⚠️ RISIKO KEAMANAN: 
    Koneksi SSH yang menggantung tanpa autentikasi dapat 
    dibiarkan terbuka lebih lama, meningkatkan risiko serangan 
    penghabisan sumber daya (connection exhaustion / Denial of Service).

tasks:
  init-log-dir:
    desc: 'Membuat direktori log jika belum tersedia'
    internal: true
    cmds:
      - mkdir -p {{.LOG_DIR}}

  info:
    desc: "Menampilkan perintah pengecekan LoginGraceTime sesuai standar CIS 5.1.13"
    silent: true
    cmds:
    - |
      printf '%s\n' \
        '==================================================' \
        ' Perintah Pengecekan LoginGraceTime:' \
        '   sshd -T | grep -i logingracetime' \
        '   grep -i "^LoginGraceTime" /etc/ssh/sshd_config*' \
        ' Standar Nilai:' \
        '   LoginGraceTime harus diatur ke 60 detik atau kurang (misal: 60).' \
        '=================================================='

  audit:
    desc: "Menjalankan audit untuk LoginGraceTime"
    deps: [init-log-dir]
    cmds:
      - python3 {{.SCRIPT_DIR}}/audit.py

  hardening:
    desc: "Menjalankan hardening untuk LoginGraceTime"
    deps: [init-log-dir]
    cmds:
      - python3 {{.SCRIPT_DIR}}/hardening.py

  rollback:
    desc: "Menjalankan rollback untuk LoginGraceTime"
    deps: [init-log-dir]
    cmds:
      - python3 {{.SCRIPT_DIR}}/rollback.py