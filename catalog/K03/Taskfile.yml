version: '3'

vars:
  PROJECT_DIR: "{{.TASKFILE_DIR}}"
  SCRIPT_DIR: "{{.PROJECT_DIR}}/scripts"
  LOG_DIR: "{{.PROJECT_DIR}}/logs"

  # Metadata CIS
  ID: "K03"
  NAMA: "Membatasi Waktu Login SSH"
  KODE_CIS: "5.1.13"
  CIS_JUDUL: "5.1.13 Ensure sshd LoginGraceTime is configured"
  RISIKO: "BERISIKO"
  KATEGORI: "SSH"

tasks:
  default:
    desc: "Menampilkan informasi catalog dan daftar task yang tersedia"
    cmds:
      - task: info

  info:
    desc: "Menampilkan metadata aturan CIS K03"
    silent: true
    cmds:
      - echo "=================================================="
      - echo " Catalog ID  : {{.ID}}"
      - echo " Nama        : {{.NAMA}}"
      - echo " Kode CIS    : {{.KODE_CIS}}"
      - echo " Judul CIS   : {{.CIS_JUDUL}}"
      - echo " Risiko      : {{.RISIKO}}"
      - echo " Kategori    : {{.KATEGORI}}"
      - echo "=================================================="

  audit:
    desc: "Menjalankan audit untuk CIS 5.1.13 LoginGraceTime"
    cmds:
      - python3 {{.SCRIPT_DIR}}/audit.py

  hardening:
    desc: "Menjalankan hardening untuk CIS 5.1.13 LoginGraceTime"
    cmds:
      - python3 {{.SCRIPT_DIR}}/hardening.py

  rollback:
    desc: "Menjalankan rollback untuk CIS 5.1.13 LoginGraceTime"
    cmds:
      - python3 {{.SCRIPT_DIR}}/rollback.py

  clean:
    desc: "Membersihkan file log pada catalog K03"
    cmds:
      - rm -rf {{.LOG_DIR}}/*.json
      - echo "Log catalog {{.ID}} berhasil dibersihkan."