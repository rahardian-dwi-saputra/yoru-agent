version: '3'

tasks:
  install:
    desc: "Instalasi lengkap Yoru-Agent (Environment, Dependencies, dan API Key)"
    cmds:
      - sudo bash ./install.sh

  setup-env:
    desc: "Setup user sistem dan konfigurasi Sudoers"
    cmds:
      - sudo bash ./setup/setup-environment.sh

  setup-dependency:
    desc: "Setup Python Virtual Environment dan API Key"
    cmds:
      - sudo bash ./setup/setup-dependencies.sh

  uninstall:
    desc: "Uninstall Yoru-Agent (Stop Aplikasi, Hapus Sudoers, Venv, dan System User)"
    cmds:
      - sudo bash ./setup/uninstall.sh

  start:
    desc: "Menjalankan FastAPI dan Web Dashboard"
    cmds:
      - sudo -u yoru-agent bash ./start-yoru-agent.sh start

  stop:
    desc: "Menghentikan FastAPI dan Web Dashboard"
    cmds:
      - sudo -u yoru-agent bash ./start-yoru-agent.sh stop

  restart:
    desc: "Memulai ulang FastAPI dan Web Dashboard"
    cmds:
      - sudo -u yoru-agent bash ./start-yoru-agent.sh restart

  status:
    desc: "Memeriksa status FastAPI dan Web Dashboard"
    cmds:
      - sudo -u yoru-agent bash ./start-yoru-agent.sh status

  logs-api:
    desc: "Melihat log FastAPI secara langsung"
    cmds:
      - tail -f /tmp/yoru-agent-api.log

  logs-web:
    desc: "Melihat log Web Dashboard secara langsung"
    cmds:
      - tail -f /tmp/yoru-agent-web.log