version: '3'

tasks:
  install:
    desc: "Instalasi penuh Yoru-Agent (User, Sudoers, Venv, & API Key)"
    cmds:
      - sudo bash ./install.sh

  setup-env:
    desc: "Hanya setup user sistem dan sudoers"
    cmds:
      - sudo bash ./setup/setup-environment.sh

  setup-dependency:
    desc: "Hanya setup Virtual Environment dan API Key"
    cmds:
      - bash ./setup/setup-dependencies.sh

  uninstall:
    desc: "Pencopotan Yoru-Agent (Hapus Sudoers, Venv, & System User)"
    cmds:
      - sudo bash ./setup/uninstall.sh